[package]
name = "backr"
version = "0.1.0"
description = "Backr desktop backup application (Tauri backend)"
authors = ["Backr contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "backr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
tauri = { version = "2.11.1", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.4"
tauri-plugin-notification = "2.3"
tauri-plugin-shell = "2.3"
tauri-plugin-dialog = "2.7"
tokio = { version = "1.52", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1.11"
once_cell = "1.21"
dirs = "6.0"
shell-escape = "0.1.5"
shellexpand = "3.1"
rand = "0.9.4"
tiny_http = "0.12.0"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk-nvidia-quirk = "1.3"

[dev-dependencies]
tempfile = "3"
