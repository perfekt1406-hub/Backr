# Tauri application crate — the desktop GUI binary for Backr.
# Tauri-specific dependencies are kept explicit here (not in workspace.dependencies)
# because they are not shared with other crates in the workspace.

[package]
name = "backr"
version = "0.1.0"
description = "Backr desktop backup application (Tauri backend)"
authors = ["Backr contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "backr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
# --- Tauri-specific (not shared via workspace) ---
tauri                      = { version = "2.11.1", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.4"
tauri-plugin-notification  = "2.3"
tauri-plugin-shell         = "2.3"
tauri-plugin-dialog        = "2.7"

# --- Shared workspace deps ---
tokio              = { workspace = true }
tokio-util         = { version = "0.7", features = ["rt"] }
serde              = { workspace = true }
serde_json         = { workspace = true }
toml               = { workspace = true }
chrono             = { workspace = true }
thiserror          = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
regex              = { workspace = true }
once_cell          = { workspace = true }
dirs               = { workspace = true }
shell-escape       = { workspace = true }
shellexpand        = { workspace = true }
rand               = { workspace = true }
tiny_http          = { workspace = true }
mdns-sd            = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk-nvidia-quirk = "1.3"

[dev-dependencies]
tempfile = "3"
