# Workspace root — defines all crates in the Backr project and shared dependency versions.
# Tauri-specific deps (tauri, tauri-plugin-*, webkit2gtk-nvidia-quirk) are intentionally
# excluded from [workspace.dependencies] because they are private to src-tauri.

[workspace]
members = [
    "src-tauri",
    "crates/backr-core",
]
resolver = "2"

# ---------------------------------------------------------------------------
# Shared dependency versions
# All workspace members that use these deps must reference them as
# { workspace = true } to keep versions consistent across crates.
# ---------------------------------------------------------------------------
[workspace.dependencies]
tokio        = { version = "1.52", features = ["full"] }
serde        = { version = "1.0",  features = ["derive"] }
serde_json   = "1.0"
toml         = "0.8"
chrono       = { version = "0.4",  features = ["serde"] }
thiserror    = "2.0"
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex        = "1.11"
once_cell    = "1.21"
dirs         = "6.0"
shell-escape = "0.1.5"
shellexpand  = "3.1"
rand         = "0.9.4"
tiny_http    = "0.12.0"
mdns-sd      = "0.20.0"
