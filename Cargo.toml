# Workspace root — defines all crates in the Backr project and shared dependency versions.
# Tauri-specific deps (tauri, tauri-plugin-*, webkit2gtk-nvidia-quirk) are intentionally
# excluded from [workspace.dependencies] because they are private to src-tauri.

[workspace]
members = [
    "src-tauri",
    "crates/backr-core",
    "crates/backrd",
    "crates/backr-cli",
]
resolver = "2"

# ---------------------------------------------------------------------------
# Shared package metadata
# The single source of truth for the release version. All workspace members
# inherit it via `version.workspace = true`, so `backr update` can compare one
# embedded version against the latest GitHub Release tag (KTD1).
# ---------------------------------------------------------------------------
[workspace.package]
version = "0.2.3"

# ---------------------------------------------------------------------------
# Shared dependency versions
# All workspace members that use these deps must reference them as
# { workspace = true } to keep versions consistent across crates.
# ---------------------------------------------------------------------------
[workspace.dependencies]
tokio        = { version = "1.52", features = ["full"] }
serde        = { version = "1.0",  features = ["derive"] }
serde_json   = "1.0"
toml         = "0.8"
chrono       = { version = "0.4",  features = ["serde"] }
thiserror    = "2.0"
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex        = "1.11"
once_cell    = "1.21"
dirs         = "6.0"
shell-escape = "0.1.5"
shellexpand  = "3.1"
rand         = "0.9.4"
tiny_http    = "0.12.0"
mdns-sd      = "0.20.0"
tokio-util   = { version = "0.7", features = ["rt"] }
uuid         = { version = "1",    features = ["v4"] }
anyhow       = "1"
clap         = { version = "4", features = ["derive"] }
# Self-update engine: in-process HTTPS (rustls by default) + SHA-256 verification,
# so verify-before-swap is typed in-crate rather than parsed from a subprocess.
ureq         = "3"
sha2         = "0.10"
